<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - effects - stereo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - effects - stereo">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_effects_stereo.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_effects_stereo.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { StereoEffect } from 'three/addons/effects/StereoEffect.js';

			let container, camera, scene, renderer, effect;

			init();

			function init() {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.z = 3;

				scene = new THREE.Scene();

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setAnimationLoop( animate );
				container.appendChild( renderer.domElement );

				effect = new StereoEffect( renderer );
				effect.setSize( window.innerWidth, window.innerHeight );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				windowHalfX = window.innerWidth / 2;
				windowHalfY = window.innerHeight / 2;

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				effect.setSize( window.innerWidth, window.innerHeight );

			}

			function onDocumentMouseMove( event ) {

				mouseX = ( event.clientX - windowHalfX ) * 0.01;
				mouseY = ( event.clientY - windowHalfY ) * 0.01;

			}

			//

			function animate() {
				effect.render( scene, camera );

			}

		</script>

		<script>
               const ws = new WebSocket("ws://" + location.host + "/sock");
		
                ws.onopen = () => {
	                	console.log("WebSocket connected!");
	                	ws.send("webInit_PSVR");
                };
		
                ws.onmessage = (event) => {
	                	console.log("XBOX VR:", event.data);
		 		};
		</script>
	</body>
</html>
